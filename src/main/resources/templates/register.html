<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | AZHAR BOOKVERSE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

    <div class="auth-brand">
        <div class="auth-logo">AB</div>
        <h1>AZHAR <span>BOOKVERSE</span></h1>
        <p>YOUR CAMPUS. YOUR KNOWLEDGE. YOUR WORLD.</p>
    </div>

    <main class="auth-card register-card">
        <div class="auth-icon">✦</div>

        <p class="auth-label">STUDENT REGISTRATION</p>
        <h2>Create Account</h2>
        <p class="auth-description">Join our campus reading community.</p>

        <div class="error-message" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="department">Department</label>
            <input type="text" id="department" name="department"
                   placeholder="Enter your department" required>

            <label for="semester">Semester</label>
            <input type="number" id="semester" name="semester"
                   min="1" max="8" placeholder="Enter your semester" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>

            <button type="submit">Create Student Account →</button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a th:href="@{/login}">Sign In</a>
        </p>

        <a class="admin-link" th:href="@{/admin/login}">
            Admin Login
        </a>
    </main>

    <footer class="auth-footer">
        © 2026 AZHAR BOOKVERSE. Read. Learn. Grow.
    </footer>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
