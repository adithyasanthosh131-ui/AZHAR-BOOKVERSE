```properties
spring.application.name=AZHAR-BOOKVERSE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

server.port=${PORT:8080}

app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

logging.level.com.mysql.cj=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
```